<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>종합 단계별 정규식 테스터</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: var(--text-main); background: var(--bg-color); line-height: 1.5; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); transition: transform 0.2s; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h2 { font-size: 1.15rem; font-weight: 700; margin-top: 0; color: #0f172a; margin-bottom: 12px; letter-spacing: -0.025em; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.88rem; color: #475569; }
        
        textarea, input[type="text"], select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; font-family: 'JetBrains Mono', monospace; background: #fff; transition: all 0.2s; }
        textarea:focus, input[type="text"]:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        textarea { height: 110px; resize: vertical; }

        .checkbox-group { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 0.9rem; align-items: center; }
        .checkbox-group label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-sub); margin-bottom: 0; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

        .pattern-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .pattern-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .chip { background: #f1f5f9; border: 1px solid var(--border-color); padding: 7px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; color: #334155; font-weight: 500; transition: all 0.2s; }
        .chip:hover { background: #e2e8f0; color: #0f172a; border-color: #cbd5e1; transform: translateY(-1px); }
        
        /* 툴팁 컨테이너 스타일 */
        .tooltip-container { position: relative; display: inline-block; }
        .file-upload-label { font-size: 0.8rem; color: var(--primary); cursor: pointer; font-weight: 600; background: #eef2ff; padding: 6px 12px; border-radius: 6px; border: 1px solid #c7d2fe; transition: all 0.2s; display: inline-block; }
        .file-upload-label:hover { background: #e0e7ff; color: var(--primary-hover); }
        
        /* 마우스 호버 시 나타나는 JSON 예시 툴팁 */
        .tooltip-container .tooltip-text {
            visibility: hidden;
            width: 300px;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: left;
            border-radius: 8px;
            padding: 12px;
            position: absolute;
            z-index: 10;
            bottom: 125%;
            right: 0;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.2s ease;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        .tooltip-container:hover .tooltip-text { visibility: visible; opacity: 1; }

        input[type="file"] { display: none; }

        .step-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .step-box { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; display: flex; gap: 12px; align-items: center; }
        .step-num { font-weight: 700; color: var(--primary); font-size: 0.9rem; min-width: 45px; }
        
        .output-box { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; padding: 14px; min-height: 55px; font-family: 'JetBrains Mono', monospace; white-space: pre-wrap; word-break: break-all; color: var(--text-main); margin-bottom: 16px; font-size: 0.9rem; }
        
        .match-card-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
        .match-item-card { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        .match-badge { background: #f1f5f9; border: 1px solid var(--border-color); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: var(--text-sub); }

        .copy-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); flex-wrap: wrap; }
        .copy-controls select, .copy-controls input { width: auto; font-size: 0.85rem; padding: 8px 12px; }

        .btn { background: #fff; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; white-space: nowrap; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
        .btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { color: #ef4444; border-color: #fecaca; background: #fff; }
        .btn-danger:hover { background: #fef2f2; border-color: #f87171; }
        .btn-text { background: none; border: none; color: var(--text-sub); font-size: 0.8rem; cursor: pointer; padding: 0; }
        .btn-text:hover { color: var(--text-main); text-decoration: underline; }

        mark { background: #fef08a; padding: 0 3px; border-radius: 3px; color: #854d0e; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-flex">
            <h2>전역 정규식 설정 (플래그 및 패턴 라이브러리)</h2>
        </div>
        <div class="checkbox-group">
            <label><input type="checkbox" id="flag-g" checked onchange="runPipeline()"> 전역 g</label>
            <label><input type="checkbox" id="flag-i" onchange="runPipeline()"> 대소문자 무시 i</label>
            <label><input type="checkbox" id="flag-m" checked onchange="runPipeline()"> 여러 줄 m</label>
            <label><input type="checkbox" id="flag-s" onchange="runPipeline()"> .에 줄바꿈 포함 s</label>
            <label><input type="checkbox" id="flag-u" onchange="runPipeline()"> 유니코드 u</label>
        </div>
        
        <div style="margin-top: 16px;">
            <div class="pattern-header">
                <label style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 0;">자주 쓰는 패턴 (클릭 시 패턴이 클립보드에 복사됩니다)</label>
                
                <!-- 마우스 hover 시 JSON 형식 안내 툴팁 적용 영역 -->
                <div class="tooltip-container">
                    <label class="file-upload-label" for="pattern-file-input">📂 패턴 파일 업로드 (.json)</label>
                    <div class="tooltip-text">[형식 예시]
[
  { "name": "패턴이름", "pattern": "정규식" },
  { "name": "이메일", "pattern": "[\\w\\.-]+@[\\w\\.-]+\\.\\w+" }
]</div>
                </div>
                <input type="file" id="pattern-file-input" accept=".json" onchange="loadPatternFile(event)">
            </div>
            <div id="pattern-chips-container" class="pattern-chips"></div>
        </div>
    </div>

    <div class="card">
        <div class="header-flex">
            <h2>원본 테스트 문자열</h2>
            <button class="btn-text" onclick="document.getElementById('test-string').value=''; runPipeline();">지우기</button>
        </div>
        <textarea id="test-string" placeholder="문자열을 입력하세요..." oninput="runPipeline()"></textarea>
    </div>

    <div class="card">
        <div class="header-flex">
            <h2>단계별 정규식 파이프라인 (Chain & Replace)</h2>
            <button class="btn btn-primary" onclick="addStep()">+ 단계 추가</button>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 12px;">이전 단계 결과물에 다음 정규식(및 치환)이 순차적으로 적용됩니다.</div>
        
        <div id="steps-container" class="step-container"></div>
    </div>

    <div class="card">
        <div class="header-flex">
            <h2>최종 결과 & 복사 제어</h2>
        </div>
        
        <div class="copy-controls">
            <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px;">
                <label style="margin: 0; font-size: 0.85rem; white-space: nowrap;">리스트 구분자:</label>
                <select id="delimiter-select" onchange="handleDelimiterChange()">
                    <option value="newline">줄바꿈 (\n)</option>
                    <option value="space">띄어쓰기 ( )</option>
                    <option value="comma">쉼표 (, )</option>
                    <option value="custom">직접 입력</option>
                </select>
                <input type="text" id="custom-delimiter" value="" placeholder="직접 입력" style="display: none; flex: 1;" />
            </div>
        </div>

        <!-- 1. 원본 기준 하이라이트 미리보기 -->
        <div style="font-size: 0.88rem; color: var(--text-main); font-weight: 700; margin-bottom: 6px;">1. 원본 기준 최종 하이라이트 미리보기</div>
        <div id="match-output" class="output-box"></div>

        <!-- 2. 매치/치환된 단어 리스트 -->
        <div class="header-flex" style="margin-top: 18px; margin-bottom: 6px;">
            <label style="font-size: 0.88rem; color: var(--text-main); font-weight: 700; margin-bottom: 0;">2. 매치된 단어 / 치환된 항목 리스트</label>
            <div style="display: flex; gap: 6px;">
                <button class="btn" onclick="copyMatches()">매치 항목 복사</button>
                <button class="btn btn-primary" onclick="copyReplacedItems()">치환된 항목 복사</button>
            </div>
        </div>
        <div id="match-cards-container" class="match-card-list">
            <div style="color: #94a3b8; font-size: 0.9rem; font-family: 'JetBrains Mono', monospace; padding: 12px;">일치하는 항목이 없습니다.</div>
        </div>

        <!-- 3. 치환된 전체 문장 -->
        <div class="header-flex" style="margin-top: 18px; margin-bottom: 6px;">
            <label style="font-size: 0.88rem; color: #15803d; font-weight: 700; margin-bottom: 0;">3. 전체 문장에서 치환된 결과물</label>
            <button class="btn btn-primary" onclick="copyFullReplacedText()">전체 문장 복사</button>
        </div>
        <div id="full-replace-output" class="output-box" style="background: #f0fdf4; border-color: #bbf7d0;"></div>
    </div>

<script>
    const testStringInput = document.getElementById('test-string');
    const stepsContainer = document.getElementById('steps-container');
    const matchOutput = document.getElementById('match-output');
    const fullReplaceOutput = document.getElementById('full-replace-output');
    const matchCardsContainer = document.getElementById('match-cards-container');
    const delimiterSelect = document.getElementById('delimiter-select');
    const customDelimiter = document.getElementById('custom-delimiter');
    const patternChipsContainer = document.getElementById('pattern-chips-container');
    
    const flagG = document.getElementById('flag-g');
    const flagI = document.getElementById('flag-i');
    const flagM = document.getElementById('flag-m');
    const flagS = document.getElementById('flag-s');
    const flagU = document.getElementById('flag-u');

    let defaultPatterns = [
        { name: "이메일", pattern: "[\\w\\.-]+@[\\w\\.-]+\\.\\w+" },
        { name: "휴대폰 번호", pattern: "01[0-9]-[0-9]{3,4}-[0-9]{4}" },
        { name: "URL", pattern: "https?://[\\w\\-_]+(\\.[\\w\\-_]+)+([\\w\\-\\.,@?^=%&amp;:/~\\+#]*[\\w\\-\\@?^=%&amp;/~\\+#])?" },
        { name: "숫자", pattern: "[0-9]+" },
        { name: "한글", pattern: "[가-힣]+" },
        { name: "날짜(YYYY-MM-DD)", pattern: "\\d{4}-\\d{2}-\\d{2}" },
        { name: "HTML 태그", pattern: "<[^>]+>" }
    ];

    let steps = [
        { pattern: "\\(([^)]+)\\)", replace: "$1" },
        { pattern: "([^/\\s]+)", replace: "#$1" }
    ];

    function renderChips(patterns) {
        patternChipsContainer.innerHTML = '';
        patterns.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'chip';
            btn.textContent = item.name;
            btn.onclick = () => {
                navigator.clipboard.writeText(item.pattern).then(() => {
                    alert(`[${item.name}] 패턴이 클립보드에 복사되었습니다!`);
                });
            };
            patternChipsContainer.appendChild(btn);
        });
    }

    function loadPatternFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                if (Array.isArray(parsed)) {
                    renderChips(parsed);
                    alert(`패턴 파일 로드 완료! (${parsed.length}개 패턴)`);
                } else {
                    alert('올바른 JSON 배열 형식이 아닙니다.');
                }
            } catch (err) {
                alert('JSON 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
            }
        };
        reader.readAsText(file);
    }

    function renderSteps() {
        stepsContainer.innerHTML = '';
        steps.forEach((step, index) => {
            const div = document.createElement('div');
            div.className = 'step-box';
            div.innerHTML = `
                <div class="step-num">Step ${index + 1}</div>
                <div style="flex: 2;">
                    <label style="font-size: 0.75rem; margin-bottom: 2px;">정규식 패턴</label>
                    <input type="text" value="" placeholder="예: \\(([^)]+)\\)" oninput="updateStep(${index}, 'pattern', this.value)">
                </div>
                <div style="flex: 1.5;">
                    <label style="font-size: 0.75rem; margin-bottom: 2px;">치환 (Replace, 비우면 삭제)</label>
                    <input type="text" value="" placeholder="예: $1 또는 빈칸" oninput="updateStep(${index}, 'replace', this.value)">
                </div>
                <div style="display: flex; align-items: flex-end; padding-top: 18px;">
                    <button class="btn btn-danger" onclick="removeStep(${index})">삭제</button>
                </div>
            `;
            stepsContainer.appendChild(div);
        });
        runPipeline();
    }

    function addStep() {
        steps.push({ pattern: "", replace: "" });
        renderSteps();
    }

    function removeStep(index) {
        steps.splice(index, 1);
        renderSteps();
    }

    function updateStep(index, field, value) {
        steps[index][field] = value;
        runPipeline();
    }

    function getFlags() {
        let flags = '';
        if (flagG.checked) flags += 'g';
        if (flagI.checked) flags += 'i';
        if (flagM.checked) flags += 'm';
        if (flagS.checked) flags += 's';
        if (flagU.checked) flags += 'u';
        return flags;
    }

    function runPipeline() {
        let currentItems = [{ text: testStringInput.value, start: 0, end: testStringInput.value.length }];
        let rawMatches = [];
        let replacedItems = [];
        const flags = getFlags();

        let fullReplacedText = testStringInput.value;
        steps.forEach((step) => {
            if (!step.pattern) return;
            try {
                const regex = new RegExp(step.pattern, flags.includes('g') ? flags : flags + 'g');
                const replaceStr = (step.replace !== undefined) ? step.replace : "";
                fullReplacedText = fullReplacedText.replace(regex, replaceStr);
            } catch (e) {}
        });
        fullReplaceOutput.textContent = fullReplacedText;
        window.lastFullReplacedText = fullReplacedText;

        steps.forEach((step, idx) => {
            if (!step.pattern) return;
            try {
                const regex = new RegExp(step.pattern, flags);
                let nextItems = [];

                currentItems.forEach(item => {
                    let subMatch;
                    const globalRegex = new RegExp(step.pattern, flags.includes('g') ? flags : flags + 'g');
                    let hasMatched = false;

                    while ((subMatch = globalRegex.exec(item.text)) !== null) {
                        hasMatched = true;
                        const fullMatch = subMatch[0];
                        const targetIdx = subMatch.index;
                        
                        const absoluteStart = item.start + targetIdx;
                        const absoluteEnd = absoluteStart + fullMatch.length;
                        
                        const evaluatedReplace = (step.replace !== "") ? fullMatch.replace(regex, step.replace) : fullMatch;

                        nextItems.push({
                            text: evaluatedReplace,
                            start: absoluteStart,
                            end: absoluteEnd,
                            raw: fullMatch
                        });
                    }

                    if (!hasMatched) {
                        nextItems.push(item);
                    }
                });

                currentItems = nextItems;
            } catch (e) {
                matchOutput.textContent = `Step ${idx + 1} 정규식 오류: ` + e.message;
                return;
            }
        });

        const originalText = testStringInput.value;
        let highlighted = '';
        let currentIdx = 0;
        let cardHtmlList = [];

        currentItems.forEach((item, i) => {
            rawMatches.push(item.raw !== undefined ? item.raw : item.text);
            replacedItems.push(item.text);

            cardHtmlList.push(`
                <div class="match-item-card">
                    <div><span class="match-badge">#${i + 1}</span>${escapeHtml(item.text)}</div>
                    <div style="color: var(--text-sub); font-size: 0.8rem;">위치 ${item.start}</div>
                </div>
            `);

            highlighted += escapeHtml(originalText.slice(currentIdx, item.start));
            highlighted += `<mark>${escapeHtml(originalText.slice(item.start, item.end))}</mark>`;
            currentIdx = item.end;
        });
        highlighted += escapeHtml(originalText.slice(currentIdx));

        if (originalText.length > 0 && currentItems.length > 0) {
            matchOutput.innerHTML = highlighted;
            matchCardsContainer.innerHTML = cardHtmlList.join('');
        } else {
            matchOutput.textContent = originalText || '문자열이 비어있습니다.';
            matchCardsContainer.innerHTML = '<div style="color: #94a3b8; font-size: 0.9rem; font-family: \'JetBrains Mono\', monospace; padding: 12px;">일치하는 항목이 없습니다.</div>';
        }

        window.lastMatchedList = rawMatches;
        window.lastReplacedList = replacedItems;
    }

    function handleDelimiterChange() {
        customDelimiter.style.display = delimiterSelect.value === 'custom' ? 'block' : 'none';
    }

    function getDelimiter() {
        const val = delimiterSelect.value;
        if (val === 'newline') return '\n';
        if (val === 'space') return ' ';
        if (val === 'comma') return ', ';
        if (val === 'custom') return customDelimiter.value;
        return '\n';
    }

    function copyMatches() {
        const list = window.lastMatchedList || [];
        if (list.length === 0) {
            alert('복사할 매치 항목이 없습니다.');
            return;
        }
        navigator.clipboard.writeText(list.join(getDelimiter())).then(() => {
            alert(`매치된 항목 ${list.length}개가 클립보드에 복사되었습니다.`);
        });
    }

    function copyReplacedItems() {
        const list = window.lastReplacedList || [];
        if (list.length === 0) {
            alert('복사할 치환된 항목이 없습니다.');
            return;
        }
        navigator.clipboard.writeText(list.join(getDelimiter())).then(() => {
            alert(`치환된 항목 ${list.length}개가 클립보드에 복사되었습니다.`);
        });
    }

    function copyFullReplacedText() {
        const text = window.lastFullReplacedText || "";
        if (!text) {
            alert('복사할 텍스트가 없습니다.');
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            alert('전체 치환된 문장이 클립보드에 복사되었습니다.');
        });
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function escapeHtmlAttr(str) {
        return str.replace(/"/g, "&quot;");
    }

    renderChips(defaultPatterns);
    renderSteps();
</script>

</body>
</html>
