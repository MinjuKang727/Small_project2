<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>쿠팡 파트너스 상품 검색기</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input[type="text"] { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .product-card { border: 1px solid #e1e4e8; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; background: #fff; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        .product-card img { width: 100%; height: 200px; object-fit: contain; margin-bottom: 15px; border-radius: 4px; }
        .product-title { font-size: 14px; color: #333; margin-bottom: 10px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .product-price { font-size: 16px; color: #d9534f; font-weight: bold; margin-bottom: 15px; }
        .btn-link { display: block; text-align: center; background-color: #ff5722; color: white; padding: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .btn-link:hover { background-color: #e64a19; }
        .loading { text-align: center; font-size: 18px; color: #666; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>쿠팡 파트너스 상품 검색</h1>
    <div class="search-box">
        <input type="text" id="keyword" placeholder="검색할 상품명을 입력하세요 (예: 무선 이어폰)" onkeydown="if(event.keyCode===13) searchProducts()">
        <button onclick="searchProducts()">검색</button>
    </div>

    <div id="loading" class="loading">상품을 불러오는 중입니다...</div>
    <div id="result" class="product-grid"></div>
</div>

<script>
    async function searchProducts() {
        const keyword = document.getElementById('keyword').value.trim();
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');

        if (!keyword) {
            alert('검색어를 입력해주세요.');
            return;
        }

        resultDiv.innerHTML = '';
        loadingDiv.style.display = 'block';

        try {
            const response = await fetch(`/search?keyword=${encodeURIComponent(keyword)}`);
            const data = await response.json();
            
            loadingDiv.style.display = 'none';

            if (data.error) {
                alert('에러 발생: ' + data.error);
                return;
            }

            const products = data.data?.productData;
            if (!products || products.length === 0) {
                resultDiv.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777;">검색 결과가 없습니다.</p>';
                return;
            }

            products.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <img src="${item.productImage}" alt="${item.productName}">
                        <div class="product-title">${item.productName}</div>
                        <div class="product-price">${Number(item.productPrice).toLocaleString()}원</div>
                    </div>
                    <a href="${item.productUrl}" target="_blank" class="btn-link">상품 링크 및 구매하기</a>
                `;
                resultDiv.appendChild(card);
            });

        } catch (error) {
            loadingDiv.style.display = 'none';
            alert('서버 통신 중 오류가 발생했습니다.');
            console.error(error);
        }
    }
</script>

</body>
</html>
