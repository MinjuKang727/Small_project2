<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>논리 게이트 시뮬레이터 (NAND 완벽 분리 수정)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333333;
            padding: 20px;
        }

        .simulator-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 25px;
            color: #1a1a1a;
        }

        /* 입력 패널 */
        .inputs-panel {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eaedf0;
        }

        .input-box {
            text-align: center;
        }

        .input-box label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: #444444;
            margin-bottom: 10px;
        }

        .toggle-btn {
            width: 60px;
            height: 60px;
            font-size: 28px;
            font-weight: bold;
            border: 3px solid #ccd1d9;
            border-radius: 50%;
            background-color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555555;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .toggle-btn:hover {
            border-color: #b0b7c3;
        }

        .toggle-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        /* 게이트 리스트 */
        .gates-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .gate-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background-color: #f8f9fa;
            border: 1px solid #eaedf0;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .gate-item:hover {
            background-color: #edf2f7;
        }

        .gate-details {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 60%;
        }

        .gate-icon {
            width: 58px;
            height: 34px;
        }
        
        .svg-el {
            stroke: #555555;
            stroke-width: 2;
            fill: none;
            stroke-linejoin: round;
            stroke-linecap: round;
            transition: stroke 0.3s;
        }

        .gate-item.high .svg-el {
            stroke: #16a34a;
        }

        .gate-info .gate-name {
            font-size: 15px;
            font-weight: 700;
            color: #333333;
        }

        .gate-info .gate-desc {
            font-size: 11px;
            color: #718096;
            margin-top: 1px;
        }

        .gate-output-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .gate-output {
            font-size: 18px;
            font-weight: bold;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            background-color: #e2e8f0;
            color: #4a5568;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .gate-output.high {
            background-color: #dcfce7;
            color: #166534;
            border-color: #86efac;
        }

        .note {
            font-size: 12px;
            color: #a0aec0;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="simulator-container">
        <h1>논리 게이트 시뮬레이터</h1>
        
        <!-- 입력 스위치 영역 -->
        <div class="inputs-panel">
            <div class="input-box">
                <label>입력 A</label>
                <button id="btn-a" class="toggle-btn" onclick="toggleInput('A')">0</button>
            </div>
            <div class="input-box">
                <label>입력 B</label>
                <button id="btn-b" class="toggle-btn" onclick="toggleInput('B')">0</button>
            </div>
        </div>

        <!-- 게이트 결과 목록 영역 -->
        <div class="gates-list">
            <!-- AND -->
            <div class="gate-item" id="item-and">
                <div class="gate-details">
                    <svg class="gate-icon" viewBox="0 0 64 34">
                        <path class="svg-el" d="M 12 4 H 24 A 13 13 0 0 1 24 30 H 12 Z"/>
                        <line class="svg-el" x1="2" y1="10" x2="12" y2="10" />
                        <line class="svg-el" x1="2" y1="24" x2="12" y2="24" />
                        <line class="svg-el" x1="37" y1="17" x2="52" y2="17" />
                    </svg>
                    <div class="gate-info">
                        <div class="gate-name">AND</div>
                        <div class="gate-desc">둘 다 1일 때 1</div>
                    </div>
                </div>
                <div class="gate-output-area">
                    <div id="out-and" class="gate-output">0</div>
                </div>
            </div>

            <!-- OR -->
            <div class="gate-item" id="item-or">
                <div class="gate-details">
                    <svg class="gate-icon" viewBox="0 0 64 34">
                        <path class="svg-el" d="M 12 4 C 20 4 28 9 32 17 C 28 25 20 30 12 30 C 16 21 16 13 12 4 Z"/>
                        <line class="svg-el" x1="2" y1="10" x2="12" y2="10" />
                        <line class="svg-el" x1="2" y1="24" x2="12" y2="24" />
                        <line class="svg-el" x1="32" y1="17" x2="52" y2="17" />
                    </svg>
                    <div class="gate-info">
                        <div class="gate-name">OR</div>
                        <div class="gate-desc">하나라도 1이면 1</div>
                    </div>
                </div>
                <div class="gate-output-area">
                    <div id="out-or" class="gate-output">0</div>
                </div>
            </div>

            <!-- NOT -->
            <div class="gate-item" id="item-not">
                <div class="gate-details">
                    <svg class="gate-icon" viewBox="0 0 64 34">
                        <path class="svg-el" d="M 12 5 L 26 17 L 12 29 Z"/>
                        <circle class="svg-el" cx="29" cy="17" r="2.5" fill="#ffffff" />
                        <line class="svg-el" x1="2" y1="17" x2="12" y2="17" />
                        <line class="svg-el" x1="31.5" y1="17" x2="52" y2="17" />
                    </svg>
                    <div class="gate-info">
                        <div class="gate-name">NOT (A)</div>
                        <div class="gate-desc">입력 A의 반대</div>
                    </div>
                </div>
                <div class="gate-output-area">
                    <div id="out-not" class="gate-output high">1</div>
                </div>
            </div>

            <!-- NAND (AND와 완벽히 동일한 몸체 + 바깥쪽에 명확히 떨어진 반전 버블) -->
            <div class="gate-item" id="item-nand">
                <div class="gate-details">
                    <svg class="gate-icon" viewBox="0 0 64 34">
                        <!-- AND와 동일한 본체 패스 -->
                        <path class="svg-el" d="M 12 4 H 24 A 13 13 0 0 1 24 30 H 12 Z"/>
                        <!-- 반전 버블 (본체 오른쪽 끝 x=37 지점에 정확히 바깥으로 붙음) -->
                        <circle class="svg-el" cx="39.5" cy="17" r="2.5" fill="#ffffff" />
                        <!-- 입력선 -->
                        <line class="svg-el" x1="2" y1="10" x2="12" y2="10" />
                        <line class="svg-el" x1="2" y1="24" x2="12" y2="24" />
                        <!-- 출력선 (버블 오른쪽인 x=42부터 시작) -->
                        <line class="svg-el" x1="42" y1="17" x2="52" y2="17" />
                    </svg>
                    <div class="gate-info">
                        <div class="gate-name">NAND</div>
                        <div class="gate-desc">AND의 반대</div>
                    </div>
                </div>
                <div class="gate-output-area">
                    <div id="out-nand" class="gate-output high">1</div>
                </div>
            </div>

            <!-- NOR -->
            <div class="gate-item" id="item-nor">
                <div class="gate-details">
                    <svg class="gate-icon" viewBox="0 0 64 34">
                        <path class="svg-el" d="M 12 4 C 20 4 28 9 32 17 C 28 25 20 30 12 30 C 16 21 16 13 12 4 Z"/>
                        <circle class="svg-el" cx="34.5" cy="17" r="2.5" fill="#ffffff" />
                        <line class="svg-el" x1="2" y1="10" x2="12" y2="10" />
                        <line class="svg-el" x1="2" y1="24" x2="12" y2="24" />
                        <line class="svg-el" x1="37" y1="17" x2="52" y2="17" />
                    </svg>
                    <div class="gate-info">
                        <div class="gate-name">NOR</div>
                        <div class="gate-desc">OR의 반대</div>
                    </div>
                </div>
                <div class="gate-output-area">
                    <div id="out-nor" class="gate-output high">1</div>
                </div>
            </div>

            <!-- XOR -->
            <div class="gate-item" id="item-xor">
                <div class="gate-details">
                    <svg class="gate-icon" viewBox="0 0 64 34">
                        <path class="svg-el" d="M 14 4 C 22 4 30 9 34 17 C 30 25 22 30 14 30 C 18 21 18 13 14 4 Z"/>
                        <path class="svg-el" d="M 11 4 C 15 13 15 21 11 30"/>
                        <line class="svg-el" x1="2" y1="10" x2="14" y2="10" />
                        <line class="svg-el" x1="2" y1="24" x2="14" y2="24" />
                        <line class="svg-el" x1="34" y1="17" x2="52" y2="17" />
                    </svg>
                    <div class="gate-info">
                        <div class="gate-name">XOR</div>
                        <div class="gate-desc">다를 때 1</div>
                    </div>
                </div>
                <div class="gate-output-area">
                    <div id="out-xor" class="gate-output">0</div>
                </div>
            </div>
        </div>

        <div class="note">* 버튼을 클릭하여 입력값 A, B를 변경해보세요. 초록색 불은 논리적 '참(1)'을 의미합니다.</div>
    </div>

    <script>
        let inputs = { A: 0, B: 0 };

        function toggleInput(target) {
            inputs[target] = inputs[target] === 0 ? 1 : 0;
            
            const btn = document.getElementById(`btn-${target.toLowerCase()}`);
            btn.textContent = inputs[target];
            btn.classList.toggle('active');

            calculateGates();
        }

        function setOutput(gateId, value) {
            const itemEl = document.getElementById(`item-${gateId}`);
            const outEl = document.getElementById(`out-${gateId}`);
            
            outEl.textContent = value;
            if (value === 1) {
                itemEl.classList.add('high');
                outEl.classList.add('high');
            } else {
                itemEl.classList.remove('high');
                outEl.classList.remove('high');
            }
        }

        function calculateGates() {
            const A = inputs.A;
            const B = inputs.B;

            const andVal = (A && B) ? 1 : 0;
            const orVal = (A || B) ? 1 : 0;
            const xorVal = (A !== B) ? 1 : 0;

            setOutput('and', andVal);
            setOutput('or', orVal);
            setOutput('not', A ? 0 : 1);
            setOutput('nand', andVal ? 0 : 1);
            setOutput('nor', orVal ? 0 : 1);
            setOutput('xor', xorVal);
        }

        calculateGates();
    </script>
</body>
</html>
